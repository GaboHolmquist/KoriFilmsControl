<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kori Films — Plataforma de Cartas Digitales</title>
  <meta name="description" content="Plataforma de cartas digitales y menús QR interactivos de alta calidad visual.">
  <meta name="theme-color" content="#07080b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root {
      --bg-dark: #07080b;
      --card-bg: rgba(18, 21, 30, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #f1f5f9;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Iluminación ambiental cinematográfica */
    .ambient-glow-1 {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 450px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 350px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
    }

    /* Navbar sutil */
    .landing-nav {
      position: relative;
      z-index: 10;
      padding: 1.75rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .landing-brand {
      display: flex;
      align-items: center;
      text-decoration: none;
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .landing-brand:hover {
      opacity: 1;
    }

    .landing-brand img {
      height: 32px;
      width: auto;
      display: block;
    }

    .nav-btn-control {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      padding: 0.45rem 1rem;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn-control:hover {
      background: var(--accent);
      color: #07080b;
      box-shadow: 0 0 18px var(--accent-glow);
      transform: translateY(-1px);
    }

    /* Contenedor central (Hero minimalista) */
    .hero-container {
      position: relative;
      z-index: 1;
      max-width: 650px;
      width: 100%;
      margin: auto;
      padding: 2rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo Kori Films — más pequeño y refinado */
    .hero-logo-img {
      max-width: 320px;
      width: 80%;
      height: auto;
      margin: 0 auto 2.5rem;
      display: block;
      filter: drop-shadow(0 12px 35px rgba(0, 0, 0, 0.9));
      transition: transform 0.3s ease;
    }

    .hero-logo-img:hover {
      transform: scale(1.02);
    }

    /* Botón principal: Acceso a carta demo */
    .main-action-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 2.25rem;
    }

    .cta-main {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #04100c;
      padding: 1rem 2rem;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 28px var(--accent-glow);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .cta-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 35px rgba(16, 185, 129, 0.45);
      filter: brightness(1.06);
    }

    .cta-main:active {
      transform: translateY(0);
    }

    /* Sección intermedia: Cartas disponibles */
    .available-menus-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .available-menus-label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #64748b;
    }

    .menus-list {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      width: 100%;
    }

    .cta-client-menu {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0.85rem 1.6rem;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      color: #e2e8f0;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cta-client-menu:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(16, 185, 129, 0.35);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .cta-client-menu:active {
      transform: translateY(0);
    }

    .client-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.7);
      flex-shrink: 0;
    }

    /* Sección inferior: Acceso a cartas digitales (Control / Administración) */
    .admin-access-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .cta-admin-access {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0.85rem 1.6rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #cbd5e1;
      font-size: 0.92rem;
      font-weight: 500;
      text-decoration: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .cta-admin-access:hover {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .cta-admin-access:active {
      transform: translateY(0);
    }

    /* Footer sutil */
    .landing-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.78rem;
      color: #475569;
      position: relative;
      z-index: 1;
    }

    .landing-footer a {
      color: #64748b;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .landing-footer a:hover {
      color: var(--accent);
    }

    @media (max-width: 480px) {
      .hero-logo-img {
        max-width: 240px;
        margin-bottom: 2rem;
      }

      .cta-main {
        width: 100%;
        justify-content: center;
        padding: 0.95rem 1.25rem;
        font-size: 0.95rem;
      }

      .cta-client-menu {
        width: 100%;
        justify-content: center;
      }

      .cta-admin-access {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>

  <!-- Header sutil -->
  <header class="landing-nav">
    <a href="/" class="landing-brand" aria-label="Kori Films">
      <img src="assets/kori-mark.png" alt="Kori Films">
    </a>
    <a href="control/" class="nav-btn-control">
      <span>Kori Control</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"></path>
      </svg>
    </a>
  </header>

  <!-- Contenedor Central Minimalista -->
  <main class="hero-container">
    <!-- Logo Kori Films -->
    <img src="assets/logo-kori.png" alt="Kori Films" class="hero-logo-img">

    <!-- 1. Botón Principal: Acceso a Carta Demo (Verde) -->
    <div class="main-action-wrap">
      <a href="demo.html" class="cta-main">
        <span>Acceso a carta demo</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"></path>
        </svg>
      </a>
    </div>

    <!-- 2. Sección: Cartas Disponibles -->
    <div class="available-menus-section">
      <span class="available-menus-label">Cartas disponibles</span>
      <div class="menus-list">
        <a href="https://tenchamatcheria.com" target="_blank" rel="noopener" class="cta-client-menu">
          <span class="client-dot"></span>
          <span>Ver carta de Tencha</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17L17 7M17 7H7M17 7V17"></path>
          </svg>
        </a>
      </div>
    </div>

    <!-- 3. Acceso a las Cartas Digitales (Administración / Plataforma) -->
    <div class="admin-access-section">
      <a href="control/" class="cta-admin-access">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Acceso a cartas digitales</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"></path>
        </svg>
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="landing-footer">
    <p>© 2026 Kori Films • <a href="control/">Panel de Control</a></p>
  </footer>

</body>
</html>
