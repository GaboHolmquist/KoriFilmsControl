<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kori Films Control — Acceso Centralizado</title>
  <meta name="description" content="Panel maestro y administración de cartas digitales gastronómicas para restaurantes y cafeterías.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2310b981'/><text x='50%' y='65%' font-size='55' font-weight='800' fill='white' text-anchor='middle'>K</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

  <div class="auth-bg-ambient"></div>

  <main class="auth-card">
    <div class="auth-brand-header">
      <div class="auth-logo-symbol">K</div>
      <h1 class="auth-title">KORI FILMS CONTROL</h1>
      <p class="auth-subtitle">Panel Maestro & Administración de Cartas Digitales</p>
    </div>

    <!-- BANNER DE BLOQUEO ANTI-FUERZA BRUTA (1 MINUTO AL 4TO INTENTO) -->
    <div id="lockout-alert" class="lockout-banner hidden" role="alert" aria-live="assertive">
      <div class="lockout-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <div class="lockout-content">
        <div class="lockout-title">Acceso Bloqueado por Seguridad</div>
        <p class="lockout-desc">Has superado el límite de 4 intentos fallidos. Por protección de la plataforma, el acceso está suspendido temporalmente.</p>
        <div class="lockout-timer-pill">
          <span>Tiempo restante:</span>
          <strong id="lockout-timer">60s</strong>
        </div>
      </div>
    </div>

    <!-- Mensajes dinámicos de error / éxito -->
    <div id="login-message" class="auth-message hidden"></div>

    <!-- Formulario de Login -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email-input" class="form-label">Correo Electrónico</label>
        <input 
          type="email" 
          id="email-input" 
          class="form-input" 
          placeholder="ej. admin@korifilms.cl" 
          autocomplete="email" 
          required
        >
      </div>

      <div class="form-group">
        <label for="password-input" class="form-label">Contraseña</label>
        <div class="password-input-wrapper">
          <input 
            type="password" 
            id="password-input" 
            class="form-input" 
            placeholder="••••••••••••" 
            autocomplete="current-password" 
            required
          >
          <button type="button" id="toggle-password-btn" class="toggle-password-btn" aria-label="Mostrar u ocultar contraseña">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
        <span id="submit-spinner" class="spinner hidden"></span>
        <span id="submit-text">Ingresar al Panel</span>
      </button>
    </form>

    <footer class="auth-footer">
      <p>Kori Films Control • <code>control.korifilms.cl</code></p>
    </footer>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
